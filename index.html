  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 12px;
      background: #E2E2E2;
    }
    .card {
      position: relative;
      width: min(88vw, 430px, calc(78svh * 0.745));
      line-height: 0;
      isolation: isolate;
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
    }
    .hotspot {
      position: absolute;
      display: block;
      left: 6%;
      width: 88%;
      border-radius: 999px;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
      outline-offset: 3px;
    }
    .instagram { top: 34.5%; height: 16.5%; }
    .twitter   { top: 53.0%; height: 16.0%; }
    .email     { top: 70.5%; height: 16.5%; }
    @media (max-width: 600px) {
      body {
        padding: 8px;
      }
      .card {
        width: min(92vw, 430px, calc(84svh * 0.745));
      }
    }
    @media (max-height: 520px) {
      .card {
        width: min(72vw, calc(88svh * 0.745));
      }
    }
  </style>
